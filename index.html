<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Countdown 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#ffeef2;
font-family:'Poppins',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* container */

.perspective-container{
width:90%;
max-width:400px;
height:540px;
position:relative;
}

/* card */

.card{
position:absolute;
width:100%;
height:100%;
background:white;
border-radius:25px;
padding:20px;
text-align:center;
box-shadow:0 15px 35px rgba(214,51,132,0.2);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
animation:fade .6s;
}

.active-card{
display:flex;
}

@keyframes fade{
from{opacity:0; transform:scale(.9);}
to{opacity:1; transform:scale(1);}
}

h1{
font-family:'Pacifico',cursive;
color:#d63384;
margin-bottom:10px;
}

/* photo rectangle */

.card img{
width:100%;
height:auto;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 15px 35px rgba(214,51,132,0.2);
}

/* typing */

.typeText::after{
content:"|";
animation:blink .7s infinite;
}

@keyframes blink{
50%{opacity:0;}
}

p{
font-size:1rem;
color:#555;
}

/* button */

.btn{
background:#ff4d8d;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
font-weight:600;
cursor:pointer;
margin-top:20px;
}

.btn:active{
transform:scale(.95);
}

/* timer */

.timer{
font-size:1.4rem;
font-weight:700;
color:#ff2e7a;
background:#fff0f6;
padding:15px;
border-radius:20px;
margin-top:15px;
}

/* input */

input{
padding:10px;
border-radius:10px;
border:1px solid #ddd;
width:80%;
margin-top:15px;
text-align:center;
}

</style>
</head>

<body>

<div class="perspective-container">

<!-- Card 1 -->

<div class="card active-card" id="card1">

<img src="photo1.jpg">

<h1>Hey Preeti ✨</h1>

<p class="typeText" id="text1"></p>

<button class="btn" onclick="nextCard(2)">Next 💖</button>

</div>

<!-- Card 2 -->

<div class="card" id="card2">

<img src="photo2.jpg">

<h1>Just a Question</h1>

<p class="typeText" id="text2"></p>

<button class="btn" onclick="nextCard(3)">Next 💖</button>

</div>

<!-- Card 3 -->

<div class="card" id="card3">

<img src="photo3.jpg">

<h1>Something Special</h1>

<p class="typeText" id="text3"></p>

<button class="btn" onclick="nextCard(4)">Next 🎁</button>

</div>

<!-- Card 4 -->

<div class="card" id="card4">

<img src="photo4.jpg">

<h1>🎂 Countdown</h1>

<p class="typeText" id="text4"></p>

<div class="timer" id="timer">
Loading...
</div>

<input type="password" id="passInput" placeholder="Enter Secret Code">

<button class="btn" onclick="checkPassword()">Unlock 🔐</button>

</div>

</div>

<script>

const SECRET_PASS="billa";

/* messages */

const messages={
text1:"I made something special just for you 💖",
text2:"Do you know how important you are to me?",
text3:"Your birthday surprise is almost ready 🎁",
text4:"Your special day is coming very soon..."
};

/* typing */

function typeText(id,text){

let i=0;

const el=document.getElementById(id);

el.innerHTML="";

function typing(){

if(i<text.length){

el.innerHTML+=text.charAt(i);

i++;

setTimeout(typing,40);

}

}

typing();

}

/* card change */

function nextCard(num){

document.querySelector(".active-card").classList.remove("active-card");

const next=document.getElementById("card"+num);

next.classList.add("active-card");

const textId="text"+num;

typeText(textId,messages[textId]);

if(num===4){
startCountdown();
}

}

/* first typing */

typeText("text1",messages.text1);

/* countdown */

function startCountdown(){

const target=new Date("March 16, 2026 00:00:00").getTime();

const interval=setInterval(()=>{

const now=new Date().getTime();

const distance=target-now;

const days=Math.floor(distance/(1000*60*60*24));
const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes=Math.floor((distance%(1000*60*60))/(1000*60));
const seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("timer").innerHTML=
days+"d : "+hours+"h : "+minutes+"m : "+seconds+"s";

if(distance<=0){

clearInterval(interval);

document.getElementById("timer").innerHTML="🎉 Happy Birthday 🎉";

setTimeout(()=>{
window.location.href="home.html";
},2000);

}

},1000);

}

/* password */

function checkPassword(){

const input=document.getElementById("passInput").value;

if(input===SECRET_PASS){

window.location.href="home.html";

}else{

alert("Wrong Secret Code ❌");

}

}

</script>

</body>
</html>
